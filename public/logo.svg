<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DA251D"/>
      <stop offset="100%" stop-color="#9B111E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer golden decorative circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Document Plate with shadow -->
  <rect x="120" y="90" width="272" height="332" rx="28" fill="#FFFFFF" filter="url(#dropShadow)"/>

  <!-- Document Header Banner -->
  <path d="M120 118 C120 102.5 132.5 90 148 90 L364 90 C379.5 90 392 102.5 392 118 L392 170 L120 170 Z" fill="url(#bgGrad)"/>

  <!-- Golden 5-point Star (Vietnam National Symbol) -->
  <polygon points="256,106 266,136 298,136 272,154 282,184 256,166 230,184 240,154 214,136 246,136" fill="url(#goldGrad)"/>

  <!-- Document lines representing administrative procedures -->
  <rect x="160" y="205" width="192" height="18" rx="9" fill="#E2E8F0"/>
  <rect x="160" y="240" width="150" height="16" rx="8" fill="#CBD5E1"/>
  <rect x="160" y="272" width="180" height="16" rx="8" fill="#CBD5E1"/>
  <rect x="160" y="304" width="130" height="16" rx="8" fill="#CBD5E1"/>

  <!-- Verified Checkmark Badge -->
  <circle cx="340" cy="350" r="42" fill="#10B981" filter="url(#dropShadow)"/>
  <polyline points="325,350 336,362 358,338" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
