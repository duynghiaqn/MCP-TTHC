[build]
  command = "npm run build:netlify"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = []

[[redirects]]
  from = "/plugin.json"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/mcp.json"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/.mcp.json"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/.codex-plugin/*"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/.well-known/*"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/openapi.json"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/openapi.yaml"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/schema"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/sse"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/messages"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/mcp/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, x-api-key, api-key, X-API-Key, x-auth-token, mcp-session-id, Accept, Last-Event-ID"
    Access-Control-Expose-Headers = "Content-Type, Authorization, mcp-session-id"
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
